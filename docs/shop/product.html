<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Product 1 – My Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="./css/shop.css" rel="stylesheet" />
</head>
<body class="mode-detail">
  <header class="site-header">
    <div class="container header-bar">
      <a class="logo-box" href="./index.html" aria-label="My Shop">
        <img src="./img/logo.png" alt="My Shop logo" />
      </a>
    </div>
  </header>

  <main class="container product-detail">
    <article class="detail-shell">
      <div class="detail-media">
        <img class="detail-img" src="./img/product1.png" alt="Product 1" />
      </div>

      <div class="detail-actions">
        <h1 class="sr-only">Product 1</h1>
        <p class="detail-price">29.00 EUR</p>

        <!-- PayPal sandbox -->
        <form class="paypal-form" action="https://www.sandbox.paypal.com/cgi-bin/webscr" method="post">
          <input type="hidden" name="cmd" value="_xclick" />
          <input type="hidden" name="business" value="sb-merchant@example.com" />
          <input type="hidden" name="item_name" value="Product 1" />
          <input type="hidden" name="item_number" value="SKU-001" />
          <input type="hidden" name="amount" value="29.00" />
          <input type="hidden" name="currency_code" value="EUR" />
          <input type="hidden" name="no_shipping" value="0" />
          <input type="hidden" name="return" value="http://localhost/product.html" />
          <input type="hidden" name="cancel_return" value="http://localhost/index.html" />
          <button type="submit" class="btn primary">Buy now with PayPal</button>
        </form>

        <p class="back-link"><a href="./index.html">← Back</a></p>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>&copy; <span id="year"></span> My Shop</small>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
