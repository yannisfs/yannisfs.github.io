<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Product – My Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="./css/shop.css" rel="stylesheet" />
</head>
<body class="mode-detail">
  <div class="page">
    <header class="site-header">
      <div class="header-bar">
        <a class="logo-box" href="./index.html" aria-label="My Shop">
          <img src="./img/logo.png" alt="My Shop logo" />
        </a>
      </div>
    </header>

    <main class="detail">
      <div class="detail-shell">
        <div class="detail-media">
          <img class="detail-img" src="" alt="" />
        </div>
        <div class="detail-actions">
          <h1 class="detail-title"></h1>
          <p class="detail-price"></p>

          <!-- PayPal Sandbox Buy Now -->
          <form class="paypal-form" action="https://www.sandbox.paypal.com/cgi-bin/webscr" method="post">
            <input type="hidden" name="cmd" value="_xclick" />
            <input type="hidden" name="business" value="sb-merchant@example.com" />
            <input type="hidden" name="item_name" />
            <input type="hidden" name="item_number" />
            <input type="hidden" name="amount" />
            <input type="hidden" name="currency_code" />
            <input type="hidden" name="no_shipping" value="0" />
            <input type="hidden" name="return" value="http://localhost/product.html" />
            <input type="hidden" name="cancel_return" value="http://localhost/index.html" />
            <button type="submit" class="btn primary">Buy now with PayPal</button>
          </form>

          <p class="back-link"><a href="./main.html">← Back</a></p>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function loadProduct() {
      const id = new URLSearchParams(location.search).get("id");
      if (!id) return;
      try {
        const res = await fetch("./products.json");
        const products = await res.json();
        const p = products.find(x => x.id === id);
        if (!p) return;

        document.title = `${p.name} – My Shop`;
        document.querySelector(".detail-title").textContent = p.name;
        document.querySelector(".detail-price").textContent = `${p.price} ${p.currency}`;
        const img = document.querySelector(".detail-img");
        img.src = p.image; img.alt = p.name;

        document.querySelector("input[name=item_name]").value = p.name;
        document.querySelector("input[name=item_number]").value = p.sku;
        document.querySelector("input[name=amount]").value = p.price;
        document.querySelector("input[name=currency_code]").value = p.currency;
      } catch(e){ console.error(e); }
    }
    loadProduct();
  </script>
</body>
</html>
