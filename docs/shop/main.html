<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>My Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="./css/shop.css" rel="stylesheet" />
</head>
<body class="mode-list">
  <header class="site-header">
    <div class="container header-bar">
      <a class="logo-box" href="./index.html" aria-label="My Shop">
        <img src="./img/logo.png" alt="My Shop logo" />
      </a>
    </div>
  </header>

  <main class="container">
    <ul class="product-strip" role="list">
      <li class="tile">
        <a class="tile__link" href="./product.html">
          <img class="tile__img" src="./img/product1.png" alt="Product 1" />
        </a>
      </li>
      <li class="tile">
        <a class="tile__link" href="./product.html">
          <img class="tile__img" src="./img/product2.png" alt="Product 2" />
        </a>
      </li>
      <li class="tile">
        <a class="tile__link" href="./product.html">
          <img class="tile__img" src="./img/product3.png" alt="Product 3" />
        </a>
      </li>
      <li class="tile">
        <a class="tile__link" href="./product.html">
          <img class="tile__img" src="./img/product4.png" alt="Product 4" />
        </a>
      </li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>&copy; <span id="year"></span> My Shop</small>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
